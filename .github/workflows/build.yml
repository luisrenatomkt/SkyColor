name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.1 (Forge 1.8.9) exige JDK 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # ... e Gradle 2.14 (baixado direto, sem wrapper)
      - name: Instalar Gradle 2.14.1
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: |
          gradle --no-daemon setupCIWorkspace
          gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: SkyColor-1.8.9
          path: build/libs/*.jar
